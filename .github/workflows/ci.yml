name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Engine fixtures are in sync with the TypeScript engine
        run: pnpm --filter @gotoprompter/test-fixtures generate --check

  web-e2e:
    name: Web app e2e (Playwright)
    runs-on: ubuntu-latest
    needs: js
    # Microsoft's Playwright image ships WebKit/Chromium with every system library they need, so the
    # job does not depend on the Ubuntu apt mirrors. Keep the tag in step with apps/web's @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gotoprompter/prompter-core build && pnpm --filter @gotoprompter/ui-tokens build
      - run: pnpm --filter @gotoprompter/web e2e
      - name: Print Playwright page snapshots for failed tests
        if: failure()
        run: |
          for f in apps/web/test-results/*/error-context.md; do
            [ -f "$f" ] || continue
            echo "::group::$f"; cat "$f"; echo; echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results

  site-e2e:
    name: Site e2e (Playwright)
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@gotoprompter/site
        env:
          PUBLIC_API_BASE: http://localhost:8788
          VITE_API_BASE: http://localhost:8788
      - name: Install Playwright browsers
        # The apt step behind --with-deps sometimes cannot reach the Ubuntu mirrors and hangs;
        # the runner image already ships most browser libraries, so fall back to the browsers alone.
        run: |
          timeout 600 pnpm --filter @gotoprompter/site exec playwright install --with-deps chromium \
            || pnpm --filter @gotoprompter/site exec playwright install chromium
      - run: pnpm --filter @gotoprompter/site test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: site-playwright-report
          path: apps/site/test-results
